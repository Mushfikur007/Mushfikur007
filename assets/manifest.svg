<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="Mushfikur Rahman described as an Odoo module manifest">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size: 15px; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .l { opacity: 0; animation: in .35s ease-out forwards; }
    @keyframes blink { 50% { opacity: 0; } }
    .cur { animation: blink 1s step-end infinite; }
    .k { fill: #f59e0b; } .s { fill: #86efac; } .p { fill: #cbd5e1; } .b { fill: #c084fc; } .c { fill: #64748b; font-style: italic; } .n { fill: #475569; }
  </style>
  <rect width="900" height="400" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect width="900" height="42" rx="16" fill="#161b22"/><rect y="26" width="900" height="16" fill="#161b22"/>
  <circle cx="26" cy="21" r="6" fill="#ff5f57"/><circle cx="46" cy="21" r="6" fill="#febc2e"/><circle cx="66" cy="21" r="6" fill="#28c840"/>
  <rect x="96" y="8" width="190" height="34" rx="8" fill="#0d1117"/>
  <text x="114" y="30" class="mono" fill="#e6edf3" font-size="13">🐍 __manifest__.py</text>
  <text x="884" y="30" text-anchor="end" class="mono" fill="#64748b" font-size="12">addons/mushfikur/</text>
  <g class="mono">
    <text class="l n" x="22" y="78">1</text><text class="l" x="60" y="78" style="animation-delay:.2s"><tspan class="c"># -*- the engineer behind the ERP -*-</tspan></text>
    <text class="l n" x="22" y="102">2</text><text class="l p" x="60" y="102" style="animation-delay:.5s">{</text>
    <text class="l n" x="22" y="126">3</text><text class="l" x="96" y="126" style="animation-delay:.8s"><tspan class="k">'name'</tspan><tspan class="p">: </tspan><tspan class="s">'Mushfikur Rahman'</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="150">4</text><text class="l" x="96" y="150" style="animation-delay:1.1s"><tspan class="k">'version'</tspan><tspan class="p">: </tspan><tspan class="s">'19.0.senior'</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="174">5</text><text class="l" x="96" y="174" style="animation-delay:1.4s"><tspan class="k">'summary'</tspan><tspan class="p">: </tspan><tspan class="s">'Turns business chaos into clean Odoo modules'</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="198">6</text><text class="l" x="96" y="198" style="animation-delay:1.7s"><tspan class="k">'company'</tspan><tspan class="p">: </tspan><tspan class="s">'Betopia Group'</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="222">7</text><text class="l" x="96" y="222" style="animation-delay:2s"><tspan class="k">'depends'</tspan><tspan class="p">: [</tspan><tspan class="s">'python'</tspan><tspan class="p">, </tspan><tspan class="s">'postgresql'</tspan><tspan class="p">, </tspan><tspan class="s">'owl'</tspan><tspan class="p">, </tspan><tspan class="s">'coffee'</tspan><tspan class="p">],</tspan></text>
    <text class="l n" x="22" y="246">8</text><text class="l" x="96" y="246" style="animation-delay:2.3s"><tspan class="k">'data'</tspan><tspan class="p">: [</tspan><tspan class="s">'payroll_engine.xml'</tspan><tspan class="p">, </tspan><tspan class="s">'tds_rules.xml'</tspan><tspan class="p">, </tspan><tspan class="s">'multi_company_rules.xml'</tspan><tspan class="p">],</tspan></text>
    <text class="l n" x="22" y="270">9</text><text class="l" x="96" y="270" style="animation-delay:2.6s"><tspan class="k">'superpowers'</tspan><tspan class="p">: [</tspan><tspan class="s">'zero-downtime deploys'</tspan><tspan class="p">, </tspan><tspan class="s">'exact rollbacks'</tspan><tspan class="p">],</tspan></text>
    <text class="l n" x="22" y="294">10</text><text class="l" x="96" y="294" style="animation-delay:2.9s"><tspan class="k">'installable'</tspan><tspan class="p">: </tspan><tspan class="b">True</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="318">11</text><text class="l" x="96" y="318" style="animation-delay:3.2s"><tspan class="k">'auto_install'</tspan><tspan class="p">: </tspan><tspan class="b">True</tspan><tspan class="p">,  </tspan><tspan class="c"># ships to production, debit = credit</tspan></text>
    <text class="l n" x="22" y="342">12</text><text class="l" x="96" y="342" style="animation-delay:3.5s"><tspan class="k">'license'</tspan><tspan class="p">: </tspan><tspan class="s">'LGPL-3'</tspan><tspan class="p">,</tspan></text>
    <text class="l n" x="22" y="366">13</text><text class="l p" x="60" y="366" style="animation-delay:3.8s">}</text>
    <rect class="cur" x="74" y="352" width="9" height="18" fill="#22c55e"/>
  </g>
</svg>
