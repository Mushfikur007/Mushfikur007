    <rect x="766" y="194" width="104" height="22" rx="11" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".6"/>
    <text x="818.0" y="209" text-anchor="middle" class="mono" font-size="11.5" font-weight="700" fill="#22c55e">OPERATIONAL</text>
  </g>
  <g class="row" style="animation-delay:1.4s">
