<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-label="ERP control room: systems I build and run">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .pulse { animation: pulse 1.6s ease-in-out infinite; }
    @keyframes ring { 0% { r: 5; opacity: .7; } 100% { r: 13; opacity: 0; } }
    .ring { animation: ring 1.8s ease-out infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
    .flow { stroke-dasharray: 6 9; animation: flow 1.4s linear infinite; }
    @keyframes bar { 0% { transform: scaleX(.25); } 50% { transform: scaleX(1); } 100% { transform: scaleX(.25); } }
    .bar { transform-box: fill-box; transform-origin: left center; animation: bar 3.2s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
  </style>
  <rect width="900" height="400" rx="16" fill="#0b1020" stroke="#1f2a44"/>
  <text x="30" y="44" class="sans" font-size="20" font-weight="800" fill="#e2e8f0">ERP CONTROL ROOM</text>
  <circle cx="252" cy="38" r="5" fill="#ef4444" class="pulse"/>
  <text x="264" y="43" class="mono" font-size="13" fill="#ef4444" font-weight="700">LIVE</text>
  <text x="870" y="43" text-anchor="end" class="mono" font-size="12.5" fill="#64748b">systems I build &amp; run · Odoo 19</text>
