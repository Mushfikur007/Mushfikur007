  <text x="300" y="86" class="mono" font-size="11.5" fill="#64748b">SCOPE</text>
  <text x="590" y="86" class="mono" font-size="11.5" fill="#64748b">ACTIVITY</text>
  <text x="870" y="86" text-anchor="end" class="mono" font-size="11.5" fill="#64748b">STATUS</text>
  <g class="row" style="animation-delay:0.2s">
