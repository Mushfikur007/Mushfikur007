  <path d="M30 382 H870" stroke="#22c55e" stroke-opacity=".5" stroke-width="2" class="flow"/>
  <text x="450" y="376" text-anchor="middle" class="mono" font-size="11.5" fill="#475569">uptime matters · every deploy has a rollback · every ledger balances</text>
