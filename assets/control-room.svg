    <circle cx="44" cy="117" r="5" fill="#22c55e"/><circle cx="44" cy="117" r="5" fill="none" stroke="#22c55e" class="ring" style="animation-delay:0.0s"/>
    <text x="60" y="122" class="sans" font-size="15" font-weight="700" fill="#e2e8f0">Payroll Engine</text>
    <text x="300" y="122" class="mono" font-size="12.5" fill="#94a3b8">8-role approval · payslip runs</text>
