<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Mushfikur Rahman, Senior Software Engineer">
  <style>
    .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
    .sans { font-family: 'Segoe UI','Inter',Helvetica,Arial,sans-serif; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(-40px,-40px); } }
    .grid { animation: drift 6s linear infinite; }
    @keyframes scan { 0% { transform: translateY(-20px); opacity: 0; } 10% { opacity: .55; } 90% { opacity: .55; } 100% { transform: translateY(270px); opacity: 0; } }
    .scan { animation: scan 4.5s ease-in-out infinite; }
    @keyframes reveal { from { width: 0; } to { width: 560px; } }
    .typer { animation: reveal 2.6s steps(44) .6s both; }
    @keyframes blink { 50% { opacity: 0; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes glow { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .glow { animation: glow 2.4s ease-in-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .pill { animation: rise .6s ease-out both; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0f1b33"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#06b6d4;#22c55e;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#06b6d4"><animate attributeName="stop-color" values="#06b6d4;#22c55e;#7c3aed;#06b6d4" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2d4d" stroke-width="1"/>
    </pattern>
    <linearGradient id="scanl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="260" rx="18"/></clipPath>
    <clipPath id="type"><rect class="typer" x="60" y="128" width="560" height="34"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect class="grid" x="0" y="0" width="960" height="320" fill="url(#g)" opacity=".7"/>
    <rect class="scan" x="0" y="0" width="900" height="2" fill="url(#scanl)"/>
    <circle cx="790" cy="70" r="120" fill="#7c3aed" opacity=".10"/>
    <circle cx="840" cy="210" r="90" fill="#06b6d4" opacity=".08"/>
  </g>
  <text x="60" y="58" class="mono" font-size="15" fill="#64748b">~/betopia-group $ whoami</text>
  <text x="58" y="112" class="sans" font-size="54" font-weight="800" letter-spacing="1" fill="url(#name)">Mushfikur Rahman</text>
  <g clip-path="url(#type)">
    <text x="60" y="152" class="mono" font-size="19" fill="#cbd5e1">Senior Software Engineer · ERP · Betopia Group</text>
  </g>
  <rect class="cursor" x="622" y="134" width="10" height="22" fill="#22c55e"/>
  <g class="mono" font-size="12.5" font-weight="700">
    <g class="pill" style="animation-delay:1.2s"><rect x="60" y="186" width="92" height="28" rx="14" fill="#714b67"/><text x="106" y="205" text-anchor="middle" fill="#fff">ODOO 19</text></g>
    <g class="pill" style="animation-delay:1.4s"><rect x="162" y="186" width="84" height="28" rx="14" fill="#1e3a5f"/><text x="204" y="205" text-anchor="middle" fill="#7dd3fc">PYTHON</text></g>
    <g class="pill" style="animation-delay:1.6s"><rect x="256" y="186" width="118" height="28" rx="14" fill="#1e3a5f"/><text x="315" y="205" text-anchor="middle" fill="#93c5fd">POSTGRESQL</text></g>
    <g class="pill" style="animation-delay:1.8s"><rect x="384" y="186" width="62" height="28" rx="14" fill="#3b2a52"/><text x="415" y="205" text-anchor="middle" fill="#d8b4fe">OWL</text></g>
    <g class="pill" style="animation-delay:2s"><rect x="456" y="186" width="168" height="28" rx="14" fill="#123b2c"/><text x="540" y="205" text-anchor="middle" fill="#86efac">MULTI-COMPANY ERP</text></g>
  </g>
  <g class="glow">
    <rect x="690" y="150" width="170" height="64" rx="12" fill="#0b1220" stroke="#22c55e" stroke-opacity=".6"/>
    <text x="775" y="176" text-anchor="middle" class="mono" font-size="13" fill="#94a3b8">trial balance</text>
    <text x="775" y="200" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#22c55e">Σ debit = Σ credit ✓</text>
  </g>
</svg>
